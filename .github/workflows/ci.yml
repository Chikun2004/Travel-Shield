name: TravelShield CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Run Backend Tests
      working-directory: ./backend
      run: npm test
      env:
        MONGODB_URI: mongodb://localhost:27017/travelshield-test
        JWT_SECRET: test-secret
      
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm test
      
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
      env:
        REACT_APP_API_URL: https://api.travelshield.com/v1

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
        cache: 'npm'
        
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci
      
    - name: Lint Backend
      working-directory: ./backend
      run: npm run lint
      
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Security audit
      run: |
        cd backend && npm audit
        cd ../frontend && npm audit
        
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects

  deploy:
    needs: [test, lint, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Build and push Docker images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/travelshield-backend:$IMAGE_TAG ./backend
        docker build -t $ECR_REGISTRY/travelshield-frontend:$IMAGE_TAG ./frontend
        docker push $ECR_REGISTRY/travelshield-backend:$IMAGE_TAG
        docker push $ECR_REGISTRY/travelshield-frontend:$IMAGE_TAG
        
    - name: Update ECS service
      run: |
        aws ecs update-service --cluster travelshield --service backend --force-new-deployment
        aws ecs update-service --cluster travelshield --service frontend --force-new-deployment
